<a href="#main"
    class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[70] focus:px-4 focus:py-2 focus:rounded-full focus:bg-paper-900 focus:text-paper-50">Skip
    to content</a>

<nav aria-label="Main navigation" class="fixed top-0 left-0 right-0 z-50 glass-dark">
    <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto px-5 py-3.5">
        <a routerLink="/" (click)="isMenuOpen.set(false)" class="flex items-center"
            aria-label="Jimmy Nguyen, home">
            <span class="font-serif text-xl font-bold tracking-tight text-gray-900 dark:text-gray-50">Jimmy
                Nguyen</span>
        </a>
        <button (click)="toggleMenu()" type="button"
            class="inline-flex items-center justify-center w-10 h-10 rounded-full text-gray-700 dark:text-gray-200 md:hidden hover:bg-gray-200/60 dark:hover:bg-gray-800 transition-colors"
            aria-controls="navbar-default" [attr.aria-expanded]="isMenuOpen()">
            <span class="sr-only">Open main menu</span>
            <svg class="w-5 h-5 transition-transform duration-300" [class.rotate-90]="isMenuOpen()" aria-hidden="true"
                fill="none" viewBox="0 0 17 14">
                <path stroke="currentColor" stroke-linecap="round" stroke-width="1.5" d="M1 1h15M1 7h15M4 13h12" />
            </svg>
        </button>
        <div class="w-full md:block md:w-auto" [class.hidden]="!isMenuOpen()" id="navbar-default">
            <ul class="flex flex-col gap-1 pt-4 md:pt-0 md:flex-row md:items-center md:gap-2">
                <li><a routerLink="/" fragment="about" (click)="isMenuOpen.set(false)"
                        class="nav-link block py-2 px-4">About</a></li>
                <li><a routerLink="/" fragment="projects" (click)="isMenuOpen.set(false)"
                        class="nav-link block py-2 px-4">Projects</a></li>
                <li><a routerLink="/" fragment="contact" (click)="isMenuOpen.set(false)"
                        class="nav-link block py-2 px-4">Contact</a></li>
                <li class="px-4 py-2 md:ml-3 md:pl-5 md:border-l md:border-[color:var(--line)]">
                    <button type="button" (click)="changeTheme()"
                        class="flex items-center gap-3 text-sm text-gray-600 dark:text-gray-300"
                        [attr.aria-pressed]="theme.isDark()" aria-label="Toggle dark mode">
                        <span class="theme-switch" aria-hidden="true"></span>
                        <span>{{ theme.isDark() ? 'Evening' : 'Daylight' }}</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<app-leaf-defs></app-leaf-defs>

<main id="main" class="pt-16">
    <router-outlet></router-outlet>
</main>

<footer class="relative z-[2] border-t border-[color:var(--line)]">
    <div
        class="max-w-screen-xl mx-auto px-5 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-sm text-gray-500 dark:text-gray-400">
        <p>© {{ year }} Jimmy Nguyen · Leiden, Netherlands</p>
        <p class="font-serif tracking-[0.3em]" lang="ja">一期一会</p>
    </div>
</footer>

<app-saiyan-fx></app-saiyan-fx>
