<div class="fx" [class]="'fx stage-' + stage() + ' fx-' + fxForm()" aria-hidden="true"
    [style.--ox.px]="saiyan.origin().x" [style.--oy.px]="saiyan.origin().y">
    <canvas #canvas class="fx-canvas"></canvas>
    <div class="fx-vignette"></div>
    <div class="fx-flash"></div>
    <div class="fx-shock"></div>
    <div class="fx-shock fx-shock--late"></div>
    <div class="fx-dim"></div>
</div>

<div class="scouter" [class]="'scouter scouter-' + fxForm()"
    [class.is-on]="scouter() !== 'hidden'" [class.is-over]="scouter() === 'over'"
    role="status" aria-live="polite">
    <div class="scouter-lens">
        <span class="scouter-label">{{ scouterLabel() }}</span>
        <span class="scouter-value" #power>0</span>
        <span class="scouter-over">{{ scouterOverText() }}</span>
    </div>
</div>
