<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jimmy Nguyen | Senior DevOps Engineer & Full-Stack Developer</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current url and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new url with only a query string and hash fragment,
    // e.g. http://www.foo.tld/one/two?a=b&c=d#qwe, becomes
    // http://www.foo.tld/?/one/two&a=b~and~c=d#qwe
    // Note: this script should run before the meta refresh tag
    (function(l) {
      if (l.search[0] !== '?' ) {
        var path = l.pathname.split('/').map(function(s) {
          return s.replace(/&/g, '~and~')
        }).join('/');
        var search = l.search.replace(/&/g, '~and~');
        var query = '?' + path + (search ? '&' + search.slice(1) : '') + l.hash;
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + query);
      }
    }(window.location))
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
</head>
<body>
</body>
</html>
