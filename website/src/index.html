  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which causes the browser to load the correct page without a page refresh.
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <link rel="preload" href="assets/fonts/shippori-mincho-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/zen-kaku-gothic-new-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved theme before first paint (light by default), so there is
    // no flash of the wrong theme while the app hydrates.
    (function (d) {
      try {
        if (localStorage.getItem('color-theme') === 'dark') d.classList.add('dark');
      } catch (e) {}
    }(document.documentElement));
  </script>
